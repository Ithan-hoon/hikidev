[project]
name = "hikidev"
version = "0.1.0"
description = "An autonomous developer that lives in your machine and builds whatever it wants."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "kits-config",
  "kits-logger",
  "kits-runner",
  "kits-discord",
  "kits-supervisor",
  "kits-notion",
  "pyyaml>=6.0",
  "mcp>=2.0",
]

[project.scripts]
hikidev = "hikidev.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hikidev"]

# 킷은 고정 태그로 설치한다. (v0.1.0 태그가 생기기 전까지는 아래 path 소스를 임시로 쓴다)
[tool.uv.sources]
kits-config = { path = "../kits/packages/config", editable = true }
kits-logger = { path = "../kits/packages/logger", editable = true }
kits-runner = { path = "../kits/packages/runner", editable = true }
kits-discord = { path = "../kits/packages/discord", editable = true }
kits-supervisor = { path = "../kits/packages/supervisor", editable = true }
kits-notion = { path = "../kits/packages/notion", editable = true }

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.lint.isort]
known-first-party = ["hikidev"]

[tool.ruff.lint.per-file-ignores]
"src/hikidev/prompt.py" = ["E501"]  # 프롬프트 산문
"tests/*" = ["E501"]
