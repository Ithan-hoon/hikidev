[project]
name = "hikidev"
version = "0.1.0"
description = "An autonomous developer that lives in your machine and builds whatever it wants."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "kits-config",
  "kits-logger",
  "kits-runner",
  "kits-discord",
  "kits-supervisor",
  "kits-notion",
  "pyyaml>=6.0",
  "mcp>=2.0",
]

[project.scripts]
hikidev = "hikidev.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hikidev"]

# 킷은 고정 태그로 설치한다. 올릴 때는 태그만 바꾸고 `uv lock`.
[tool.uv.sources]
kits-config = { git = "https://github.com/Ithan-hoon/kits.git", tag = "v0.1.0", subdirectory = "packages/config" }
kits-logger = { git = "https://github.com/Ithan-hoon/kits.git", tag = "v0.1.0", subdirectory = "packages/logger" }
kits-runner = { git = "https://github.com/Ithan-hoon/kits.git", tag = "v0.1.0", subdirectory = "packages/runner" }
kits-discord = { git = "https://github.com/Ithan-hoon/kits.git", tag = "v0.1.0", subdirectory = "packages/discord" }
kits-supervisor = { git = "https://github.com/Ithan-hoon/kits.git", tag = "v0.1.0", subdirectory = "packages/supervisor" }
kits-notion = { git = "https://github.com/Ithan-hoon/kits.git", tag = "v0.1.0", subdirectory = "packages/notion" }

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.lint.isort]
known-first-party = ["hikidev"]

[tool.ruff.lint.per-file-ignores]
"src/hikidev/prompt.py" = ["E501"]  # 프롬프트 산문
"tests/*" = ["E501"]
