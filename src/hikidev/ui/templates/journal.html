{% extends "base.html" %}
{% block title %}{{ name }} — 일기{% endblock %}
{% block content %}
<div class="page">
  <header class="page-header"><h1>일기</h1><span class="mono dim">{{ journals | length }}일</span></header>
  <div class="split">
    <nav class="list">
      {% for j in journals %}
      <a href="/journal?day={{ j.day }}" class="{{ 'on' if cur and cur.day == j.day else '' }}"><span class="mono">{{ j.day }}</span><span class="dim">{{ j.title[-3:] }}</span></a>
      {% else %}
      <p class="muted">아직 일기가 없다.</p>
      {% endfor %}
    </nav>
    <section>
      {% if cur %}
      <div class="eyebrow">{{ cur.title }}</div>
      <article class="paper prose">{{ cur.html | safe }}</article>
      {% endif %}
    </section>
  </div>
</div>
{% endblock %}
